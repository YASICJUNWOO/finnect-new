<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜딩 · B 관제</title>

<!--
  B 관제 — 우리가 가진 것은 공고 31,327건이다. 화면이 그 수를 직접 보여 준다.

  논지: "골라 준다"를 말로 하지 않고 그림으로 한다. 점 31,327개가 실제로 깔리고 그중 열넷만 켜진다.
        켜짐/꺼짐이 곧 자격 판별(ADR-0013)이라 색이 필요 없다 — 점 색은 하나뿐이고 밝기만 다르다.
  대가: DESIGN.md §3-1(라이트로 간다)을 정면으로 뒤집는다. 랜딩만 어두우면 제품에 들어가는 순간
        눈이 적응해야 한다. 화면 전부를 어둡게 갈 것인지가 같이 정해져야 하는 결정이다.

  **이 시안만 카피를 한 줄 더 쓴다.** 캔버스 밑의 건수 캡션이다.
  숫자가 없으면 점 밭이 근거가 아니라 장식이 된다(DESIGN.md §5.3 S9 "장식용 차트").
  값의 출처는 CLAUDE.md 와 plan/06 — 기업마당 1,538 · K-Startup 29,789.
  나머지 다섯 시안과 밀도를 비교할 때 이 한 줄을 감안해야 한다. README 에 적어 뒀다.

  하단 검은 바는 목업 전용이다.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#0b0d10;
  --surface:#14171c;
  --ink:#e8ecf2;          /* 16.1:1 */
  --ink-2:#98a3b3;        /* 7.63:1 — AAA */
  --ink-3:#69737f;
  --line:#242a33;
  --line-2:#333b46;
  --urgent:#ff6b5a;       /* 제품 --urgent(#d92d20)의 어두운 배경용 변주. 6.95:1 */
  --dot-dim:#252c37;      /* 3만 개가 '밭'으로 읽혀야 한다. 더 어두우면 그냥 검은 면이다 */
  --dot:2px;
  --lit:14;

  /* 굵기 300/400/500/600/700 을 쓴다. 다섯 다 실제로 로드되고 렌더된다.
   * **한 번 400/500/700 으로 줄였다가 되돌렸다** — `font-probe.mjs` 가 "300·400·600 이 같은 face"
   * 라고 했는데 그게 틀린 판독이었다. 한글 글자는 굵기가 달라도 advance 가 같아서 폭으로는 구분이 안 된다
   * (40px 실측: 한글 400→187.84 · 700→187.84 로 동일, 라틴 400→250.38 · 700→262.89 로 다름).
   * 획 두께는 실제로 다르다. 프로브를 라틴으로 재도록 고쳤다 */
  --sans:"IBM Plex Sans KR",'Apple SD Gothic Neo',system-ui,sans-serif;
  /* IBM Plex Mono 에는 한글이 없다 — **숫자와 라틴에만 쓴다.**
   * 한글을 넣으면 대체 서체로 떨어져 자간이 벌어진 채로 렌더된다. 한 번 그렇게 만들었다가 고쳤다 */
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.65;font-weight:400;padding-bottom:56px;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 한글이 섞이므로 sans 다. 등폭은 아래 숫자 자리에만 쓴다 */
.lab{font-size:12px;letter-spacing:.14em;color:var(--ink-2);font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}
@media(max-width:820px){.wrap{padding:0 20px}}

/* ── 상단 ── */
.nav{border-bottom:1px solid var(--line);position:relative;z-index:2}
.nav .in{max-width:1080px;margin:0 auto;height:60px;padding:0 32px;
  display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:9px;min-height:44px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--ink);
  box-shadow:0 0 0 4px rgba(232,236,242,.12)}
.nav .sp{flex:1}
.ghost{font-size:15px;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line-2);padding:0 16px;min-height:44px;display:inline-flex;align-items:center}
.ghost:hover{border-color:var(--ink-2);color:var(--ink)}

/* ── 히어로. 점 밭이 배경이다 ── */
.hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 왼쪽에서 오른쪽으로 어두워지는 막 — 글자가 앉을 자리를 만든다. 그라데이션 장식이 아니다 */
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(100deg,var(--bg) 0%,rgba(11,13,16,.94) 38%,rgba(11,13,16,.35) 68%,rgba(11,13,16,.1) 100%)}
.hero .in{position:relative;max-width:1080px;margin:0 auto;padding:96px 32px 84px}
@media(max-width:820px){.hero .in{padding:64px 20px 56px}}

.hero h1{font-size:52px;line-height:1.22;font-weight:600;letter-spacing:-.035em;max-width:15ch}
.hero h1 em{font-style:normal;font-weight:300;color:var(--ink-2);display:block}
.hero h1 em b{font-weight:600;color:var(--ink)}
@media(max-width:820px){.hero h1{font-size:36px}}
.hero p{margin-top:24px;max-width:44ch;color:var(--ink-2);font-size:17px;line-height:1.75;font-weight:300}
.act{display:flex;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}
.solid{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;
  background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;letter-spacing:-.01em;
  transition:background-color 120ms ease-out}
.solid:hover{background:#fff}
.sub{font-size:15px;color:var(--ink-2)}

/* 건수 캡션. **이 시안에만 있는 한 줄이다** */
.corpus{position:relative;margin-top:44px;padding-top:14px;border-top:1px solid var(--line);
  font-size:14px;color:var(--ink-2);
  display:flex;align-items:baseline;gap:8px 18px;flex-wrap:wrap;max-width:56ch}
.corpus b{font-family:var(--mono);color:var(--ink);font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.corpus .on{color:var(--urgent);display:inline-flex;align-items:baseline;gap:6px}
.corpus .on b{color:var(--urgent)}

/* ── 절 ── */
.sec{border-bottom:1px solid var(--line);padding:64px 0}
.sec .grid{display:grid;grid-template-columns:148px minmax(0,1fr);gap:0 32px}
@media(max-width:820px){.sec .grid{grid-template-columns:1fr;gap:18px}}
.sec h2{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.4;max-width:26ch}

/* 01·02·03 */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:26px;
  background:var(--line);border:1px solid var(--line)}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.st{background:var(--surface);padding:22px}
.st .n{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--urgent);font-weight:500}
.st h3{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:12px}
.st p{font-size:16px;line-height:1.7;color:var(--ink-2);margin-top:8px;font-weight:300}

/* 왜 다른가 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
@media(max-width:820px){.two{grid-template-columns:1fr;gap:26px}}
.two p{color:var(--ink-2);line-height:1.85;font-weight:300}
.two p+p{margin-top:14px}
.two strong{color:var(--ink);font-weight:600}
.pt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 14px;padding:14px 0;
  border-top:1px solid var(--line)}
.pt:first-child{border-top:0;padding-top:0}
.pt .m{font-family:var(--mono);font-size:12px;color:var(--urgent);font-weight:500;line-height:1.9}
.pt .t{font-weight:600;letter-spacing:-.015em}
.pt .d{color:var(--ink-2);font-size:16px;line-height:1.7;margin-top:3px;font-weight:300}

/* 안 하는 것 — 꺼진 것들이라 더 어둡다. 켜짐/꺼짐 은유를 여기서 한 번 더 쓴다 */
.nope{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:26px;
  background:var(--line);border:1px solid var(--line)}
@media(max-width:820px){.nope{grid-template-columns:1fr}}
.nope .n{background:var(--bg);padding:20px}
.nope .n h3{font-size:16px;font-weight:600;color:var(--ink-2);letter-spacing:-.015em}
.nope .n h3::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--dot-dim);border:1px solid var(--line-2);margin-right:9px;vertical-align:2px}
.nope .n p{font-size:16px;line-height:1.7;color:var(--ink-2);margin-top:6px;font-weight:300}

/* 결문 */
.end{padding:76px 0;text-align:center}
.end h2{font-size:34px;font-weight:600;letter-spacing:-.035em}
.end p{color:var(--ink-2);margin-top:10px;font-weight:300}
.end .act{justify-content:center;margin-top:28px}
.foot{border-top:1px solid var(--line);padding:20px 0 44px;
  font-size:16px;color:var(--ink-2)}
</style>
</head>

<body>

<header class="nav">
  <div class="in">
    <a class="brand" href="#"><i></i><span id="brand"></span></a>
    <span class="sp"></span>
    <a class="ghost" href="#" id="navcta"></a>
  </div>
</header>

<section class="hero">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <div class="in" id="hero"></div>
</section>

<div class="wrap">
  <section class="sec" id="how"></section>
  <section class="sec" id="why"></section>
  <section class="sec" id="nope"></section>
  <section class="end" id="end"></section>
  <p class="foot" id="foot"></p>
</div>

<script src="copy.js"></script>
<script src="variants.js"></script>
<script src="assets/harness.js"></script>
<script>
var e = COPY.esc;

document.getElementById("brand").textContent = COPY.brand;
document.getElementById("navcta").textContent = COPY.navCta;
document.getElementById("foot").textContent = COPY.foot;

document.getElementById("hero").innerHTML =
  "<h1>" + e(COPY.hero.line1) + "<em><b>" + e(COPY.hero.accent) + "</b>" + e(COPY.hero.line2Tail) + "</em></h1>" +
  "<p>" + e(COPY.hero.body) + "</p>" +
  '<div class="act"><a class="solid" href="#">' + e(COPY.hero.cta) + "</a>" +
  '<span class="sub">' + e(COPY.hero.sub) + "</span></div>" +
  /* 이 한 줄이 B 에만 있는 카피다. 출처는 CLAUDE.md · plan/06 */
  '<p class="corpus"><span>모아 둔 공고 <b>31,327</b>건 · 기업마당 <b>1,538</b> · K-Startup <b>29,789</b></span>' +
  '<span class="on">지금 켜진 것 <b id="litn">14</b></span></p>';

document.getElementById("how").innerHTML =
  '<div class="grid"><span class="lab">01 — 03</span><div>' +
  "<h2>" + e(COPY.how.h2) + "</h2>" +
  '<div class="steps">' + COPY.how.steps.map(function (s) {
    return '<div class="st"><span class="n">' + e(s.n) + "</span>" +
           "<h3>" + e(s.t) + "</h3><p>" + e(s.d) + "</p></div>";
  }).join("") + "</div></div></div>";

document.getElementById("why").innerHTML =
  '<div class="grid"><span class="lab">사유</span><div>' +
  "<h2>" + e(COPY.why.h2) + "</h2>" +
  '<div class="two"><div>' +
    COPY.why.lead.map(function (l) { return "<p>" + COPY.leadHtml(l, "strong") + "</p>"; }).join("") +
  "</div><div>" +
    COPY.why.pts.map(function (p) {
      return '<div class="pt"><span class="m">' + e(p.m) + "</span><div>" +
             '<div class="t">' + e(p.t) + '</div><div class="d">' + e(p.d) + "</div></div></div>";
    }).join("") +
  "</div></div></div></div>";

document.getElementById("nope").innerHTML =
  '<div class="grid"><span class="lab">제외</span><div>' +
  "<h2>" + e(COPY.nope.h2) + "</h2>" +
  '<div class="nope">' + COPY.nope.items.map(function (n) {
    return '<div class="n"><h3>' + e(n.t) + "</h3><p>" + e(n.d) + "</p></div>";
  }).join("") + "</div></div></div>";

document.getElementById("end").innerHTML =
  "<h2>" + e(COPY.end.h2) + "</h2><p>" + e(COPY.end.d) + "</p>" +
  '<div class="act"><a class="solid" href="#">' + e(COPY.end.cta) + "</a></div>";

/* ── 점 밭 ──────────────────────────────────────────────────────────────────
 * 공고 31,327건을 실제로 그 개수만큼 그린다. 표본이 아니다.
 * 켜지는 자리는 **고정 시드로 뽑는다** — Math.random 을 쓰면 스크린샷이 찍을 때마다 달라져
 * shot.mjs 로 시안을 대조할 수 없다. */
var N = 31327;
var cv = document.getElementById("field");
var ctx = cv.getContext("2d");
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function seeded(seed) {                       // LCG. 재현 가능하면 그만이다
  return function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
}

var t0 = null, litIdx = [], cols = 0, rows = 0, gx = 0, gy = 0, ox = 0, oy = 0;

function layout() {
  var r = cv.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cols = Math.max(1, Math.round(Math.sqrt(N * (r.width / Math.max(r.height, 1)))));
  rows = Math.ceil(N / cols);
  gx = r.width / cols;
  gy = r.height / rows;
  ox = gx / 2;
  oy = gy / 2;

  var lit = +getComputedStyle(document.documentElement).getPropertyValue("--lit") || 14;
  var rnd = seeded(20260820);
  litIdx = [];
  for (var i = 0; i < lit; i++) {
    // 오른쪽 3분의 2 안에서만 켠다 — 왼쪽은 글자가 덮는 자리다
    var c = Math.floor((0.34 + rnd() * 0.62) * cols);
    var rw = Math.floor(rnd() * rows);
    litIdx.push([c, rw]);
  }
}

function draw(now) {
  if (t0 === null) t0 = now;
  var p = reduce ? 1 : Math.min((now - t0) / 1600, 1);
  var cs = getComputedStyle(document.documentElement);
  var dim = cs.getPropertyValue("--dot-dim").trim() || "#1e242d";
  var on = cs.getPropertyValue("--ink").trim() || "#e8ecf2";
  var hot = cs.getPropertyValue("--urgent").trim() || "#ff6b5a";
  var d = parseFloat(cs.getPropertyValue("--dot")) || 2;
  var r = cv.getBoundingClientRect();

  ctx.clearRect(0, 0, r.width, r.height);

  // 꺼진 점 — 사각형으로 그린다. 3만 번 arc 를 부르면 프레임이 무너진다
  ctx.fillStyle = dim;
  for (var i = 0; i < N; i++) {
    var c = i % cols, rw = (i / cols) | 0;
    ctx.fillRect(ox + c * gx - d / 2, oy + rw * gy - d / 2, d, d);
  }

  // 켜진 점 — 순서대로 들어온다. 마지막 하나만 마감색이다
  litIdx.forEach(function (pt, k) {
    var lp = Math.max(0, Math.min((p * litIdx.length - k) / 0.9, 1));
    if (lp <= 0) return;
    var x = ox + pt[0] * gx, y = oy + pt[1] * gy;
    var last = k === litIdx.length - 1;
    ctx.globalAlpha = lp;
    ctx.fillStyle = last ? hot : on;
    ctx.shadowColor = last ? hot : on;
    ctx.shadowBlur = 9 * lp;
    ctx.beginPath();
    ctx.arc(x, y, d * 1.5, 0, 6.2832);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });

  if (p < 1) requestAnimationFrame(draw);
}

function redraw() { t0 = null; layout(); requestAnimationFrame(draw); }

redraw();
addEventListener("resize", redraw);
/* 웹폰트 전에 재면 히어로 세로가 달라 격자가 어긋난다 */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);

/* 캔버스는 그릴 때 CSS 변수를 읽는다 — 변수만 갈면 화면이 안 따라오므로 다시 그려 준다.
 * cssVar 는 남겨 둔다. 내보내기가 그것만 본다(harness.js serialize). */
function varAndRedraw(name, unit) {
  return function (v) {
    document.documentElement.style.setProperty(name, v + (unit || ""));
    redraw();
  };
}

Harness.mount({
  current: "b",
  variants: VARIANTS,
  persist: true,
  exportAs: { format: "css", selector: ":root" },
  controls: [
    { kind: "color", label: "바탕", name: "bg", value: "#0b0d10",
      cssVar: "--bg", contrastAgainst: "--ink-2", apply: varAndRedraw("--bg") },
    { kind: "color", label: "마감", name: "urgent", value: "#ff6b5a",
      cssVar: "--urgent", contrastAgainst: "--bg", apply: varAndRedraw("--urgent") },
    { kind: "range", label: "점 크기", name: "dot", value: 2, min: 1, max: 4, step: 0.5,
      cssVar: "--dot", unit: "px", apply: varAndRedraw("--dot", "px") },
    { kind: "range", label: "켜진 수", name: "lit", value: 14, min: 1, max: 40, step: 1,
      apply: function (v) {
        document.documentElement.style.setProperty("--lit", v);
        var n = document.getElementById("litn");
        if (n) n.textContent = v;
        redraw();
      } },
  ],
});
</script>
</body>
</html>
