[project]
name = "finnect"
version = "0.1.0"
description = "공고 판정과 사업계획서 집필"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    # 첨부 해독(plan/07). 스파이크가 추출률 95%를 이 두 개로 쟀다.
    # 라이브러리를 바꾸면 그 숫자가 근거가 아니게 된다 — ADR-0022.
    "olefile>=0.47",
    "pdfplumber>=0.11",
    # 사용자 파일 해독(plan/12 T-0042). 첨부에는 기본으로 안 쓴다 — 그 숫자를
    # 다시 재야 해서다. USER_FILE_FORMATS 와 ATTACHMENT_FORMATS 가 따로 있는 이유.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",  # 관리 화면 폼(수집 건수 입력) 파싱
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
# 버리는 코드(spike/)를 다시 돌릴 때만. `uv sync --group spike`
# T-0005 배점 명시율 재검증이 measure_rate.py 의 탐지기를 그대로 쓴다.
spike = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "olefile>=0.47",
    "pdfplumber>=0.11",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finnect"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
