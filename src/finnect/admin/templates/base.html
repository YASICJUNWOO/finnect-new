<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}finnect 관리{% endblock %}</title>
{% block head %}{% endblock %}
<style>
/* 임시 스타일이다. design/ 의 토큰을 따르지 않는다. 제품 화면이 아니다. */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px;
  font: 14px/1.5 ui-sans-serif, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
a { color: #0645ad; }
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 14px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ccc; }
.muted { color: #767676; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
input[type=search], select { padding: 5px 8px; font: inherit; }
button { padding: 5px 12px; font: inherit; cursor: pointer; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; vertical-align: top; }
th { font-weight: 600; white-space: nowrap; background: rgba(127,127,127,.08); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.key { width: 260px; font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
td.val { white-space: pre-wrap; word-break: break-word; }
.tag { font-size: 11px; padding: 1px 6px; border: 1px solid #999; border-radius: 3px; white-space: nowrap; }
.null { color: #999; font-style: italic; }
.pager { display: flex; gap: 12px; align-items: center; margin: 16px 0; }

nav { display: flex; gap: 16px; margin: 0 0 20px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
nav a { text-decoration: none; }
nav a.on { font-weight: 600; color: inherit; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.card { border: 1px solid #ccc; border-radius: 5px; padding: 14px 16px; }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card .stored { font-size: 22px; font-variant-numeric: tabular-nums; margin: 8px 0 2px; }
.card .actions { display: flex; gap: 8px; margin-top: 12px; }
.card form { margin: 0; }

.banner { padding: 9px 12px; border-radius: 4px; margin: 0 0 16px; border: 1px solid; }
.banner.ok { border-color: #1a7f37; }
.banner.no { border-color: #cf222e; }

.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
.pill.running { border-color: #0969da; }
.pill.ok { border-color: #1a7f37; }
.pill.failed { border-color: #cf222e; }
.pill.interrupted { border-color: #9a6700; }
/* 해독 상태. '안 해봤다'와 '해봤는데 안 됐다'와 '해봤는데 비었다'를 눈으로 갈라야 한다. */
.pill.ok { border-color: #1a7f37; }
.pill.empty { border-color: #9a6700; }
.pill.unsupported { border-color: #6e7781; }
.pill.container { border-color: #8250df; }
.pill.none { border-color: #d0d7de; color: #999; }

.meter { height: 6px; border: 1px solid #999; border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
.meter > i { display: block; height: 100%; background: #0969da; }
.warn { color: #9a6700; }
/* 설명은 호버가 아니라 컬럼이다. 마우스를 올려야 보이는 정보는 안 보이는 정보에 가깝다. */
td.desc { width: 240px; color: #444; }
/* 문서에 설명이 없는 필드. 빈칸으로 두면 '설명이 있는데 안 보이는 것'과 구별이 안 된다. */
.undoc { color: #cf222e; font-style: italic; }
.bad { color: #cf222e; }
pre { margin: 0; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
/* 원문 JSON. 기본은 접어 둔다 — 파싱한 컬럼이 먼저 읽혀야 한다. */
details.raw { border: 1px solid #ccc; border-radius: 4px; padding: 9px 12px; margin: 8px 0; }
details.raw > summary { cursor: pointer; }
details.raw > pre { margin-top: 10px; max-height: 460px; overflow: auto; }
</style>
</head>
<body>
{# 읽기 화면 넷은 Next.js 로 갔다(ADR-0027). 여기 남은 것은 수집 실행뿐이다.
   나머지로 가는 링크는 절대 주소로 낸다 — 다른 앱이라 상대 경로가 안 통한다. #}
<nav>
  <a href="/ingest" class="on">수집</a>
  <a href="http://localhost:3000/admin/notices">공고 목록 ↗</a>
  <a href="http://localhost:3000/admin/attachments">첨부 해독 ↗</a>
</nav>
<p class="muted" style="margin:-8px 0 20px">
  이 앱에는 <b>수집 실행만</b> 남았다. 조회 화면은 사용자 앱(:3000)에 있고 배포본에서도 열린다.
</p>
{% block body %}{% endblock %}
</body>
</html>
