<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜딩 · D 면</title>

<!--
  D 면 — 카드를 없앤다. 절마다 화면 전체가 색을 갈아입고, 글자가 그 면 위에 크게 앉는다.

  논지: 현행 랜딩은 회색 캔버스에 흰 카드가 반복돼서 절과 절의 차이가 여백뿐이다.
        면을 통째로 갈면 스크롤이 곧 장(章)이 되고, 카드 테두리가 필요 없어진다.
  대가: **면마다 명도가 뒤집힌다.** 스크롤 중 눈이 계속 적응해야 한다.
        §3-7(색은 위키 그래프와 문서 빈칸에만)을 통째로 다시 정해야 하고,
        §3-4(주 버튼은 근검정)는 근검정 면 위에서 성립하지 않는다 — 면마다 버튼이 반전된다.
        §4.2 가 정한 굵기 셋(400/600/700) 밖의 900 을 쓴다.

  하단 검은 바는 목업 전용이다.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --sand:#e9e4d7;
  --forest:#1c3b33;
  --coal:#15140f;
  --chalk:#fbfaf7;

  --on-sand:#15140f;   --on-sand-2:#5c574a;    /* 5.63:1 */
  --on-forest:#e9e4d7; --on-forest-2:#b3ac99;  /* 5.40:1 */
  --on-coal:#e9e4d7;   --on-coal-2:#9d978a;    /* 6.43:1 */
  --on-chalk:#15140f;  --on-chalk-2:#5c574a;   /* 6.85:1 */

  --pad:104px;         /* 면 위아래 */
  --h-weight:900;

  --sans:"Gothic A1",'Apple SD Gothic Neo',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:17px;line-height:1.7;font-weight:400;
  background:var(--sand);color:var(--on-sand);padding-bottom:56px;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid currentColor;outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 면. 색을 여기서 한 번만 정하고 안쪽은 전부 currentColor 와 변수로 받는다 */
.plane{background:var(--pl-bg);color:var(--pl-ink)}
.plane[data-tone="sand"]  {--pl-bg:var(--sand);  --pl-ink:var(--on-sand);  --pl-ink2:var(--on-sand-2)}
.plane[data-tone="forest"]{--pl-bg:var(--forest);--pl-ink:var(--on-forest);--pl-ink2:var(--on-forest-2)}
.plane[data-tone="coal"]  {--pl-bg:var(--coal);  --pl-ink:var(--on-coal);  --pl-ink2:var(--on-coal-2)}
.plane[data-tone="chalk"] {--pl-bg:var(--chalk); --pl-ink:var(--on-chalk); --pl-ink2:var(--on-chalk-2)}
.in{max-width:1180px;margin:0 auto;padding:var(--pad) 44px}
@media(max-width:820px){.in{padding:64px 22px}:root{--pad:72px}}

/* ── 상단 ── */
.nav .in{padding-top:26px;padding-bottom:0;display:flex;align-items:center;gap:24px}
.brand{font-size:17px;font-weight:900;letter-spacing:-.03em}
.nav .sp{flex:1}
.ghost{font-size:15px;font-weight:700;border-bottom:2px solid currentColor;
  padding:10px 0 3px;min-height:44px;display:inline-flex;align-items:center}
.ghost:hover{opacity:.62}

/* 버튼은 면마다 반전된다 — 잉크로 채우고 글자는 면 색이다 */
.slab{display:inline-flex;align-items:center;justify-content:center;min-height:56px;
  padding:0 30px;background:var(--pl-ink);color:var(--pl-bg);
  font-size:17px;font-weight:900;letter-spacing:-.03em;
  transition:transform 120ms ease-out}
.slab:hover{transform:translateY(-2px)}
.act{display:flex;align-items:center;gap:20px;margin-top:40px;flex-wrap:wrap}
.sub{font-size:15px;color:var(--pl-ink2);font-weight:500}

/* ── 히어로 ── */
.hero .in{padding-top:76px;padding-bottom:calc(var(--pad) * 1.1)}
/* 처음에 104px 까지 키웠다가 내렸다 — 제목이 다섯 줄로 흘러 히어로를 통째로 먹고,
   오른쪽 아래에 앉히려던 설명이 첫 화면 밖으로 밀렸다. 비대칭이 성립하려면 제목이 세 줄 안이어야 한다 */
.hero h1{font-size:clamp(42px,5.6vw,76px);line-height:1.14;font-weight:var(--h-weight);
  letter-spacing:-.05em;max-width:14ch}
.hero h1 em{font-style:normal;display:block;color:var(--pl-ink2)}
.hero h1 em b{color:var(--pl-ink);font-weight:inherit}
.hero .lede{margin-top:34px;max-width:46ch;font-size:19px;line-height:1.75;
  font-weight:400;color:var(--pl-ink2)}
@media(min-width:1000px){
  /* 비대칭 — 제목은 왼쪽 위, 설명은 오른쪽 아래로 내려앉는다 */
  .hero .body{display:grid;grid-template-columns:1.15fr .85fr;gap:0 56px;align-items:end}
  .hero .lede{margin-top:0;padding-bottom:8px}
}

h2{font-size:clamp(30px,4vw,52px);line-height:1.16;font-weight:var(--h-weight);
  letter-spacing:-.05em;max-width:22ch}

/* ── 01·02·03. 숫자가 판을 짠다 ── */
.steps{margin-top:56px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
@media(max-width:820px){.steps{grid-template-columns:1fr}}
.st{padding:0 28px 0 0;border-left:2px solid currentColor;padding-left:22px}
/* 불투명도로 흐린다 — 면마다 잉크가 뒤집히므로 색을 박으면 네 벌을 만들어야 한다.
   **0.28 로 시작했다가 0.46 으로 올렸다.** contrast.mjs 가 상록 면에서 2.11:1 을 냈고
   86px 큰 글자 기준이 3:1 이다. 0.46 이 3.2:1 이라 겨우 넘는다 — 상록을 더 밝히면 다시 재야 한다 */
.st .n{display:block;font-size:clamp(52px,6.4vw,86px);line-height:.92;font-weight:900;
  letter-spacing:-.06em;font-variant-numeric:tabular-nums;opacity:.46}
.st h3{font-size:22px;font-weight:700;letter-spacing:-.035em;margin-top:18px;line-height:1.4}
.st p{font-size:16px;line-height:1.7;color:var(--pl-ink2);margin-top:10px;font-weight:400}

/* ── 왜 다른가 ── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:52px;margin-top:44px}
@media(max-width:900px){.two{grid-template-columns:1fr;gap:32px}}
.two p{font-size:18px;line-height:1.85;color:var(--pl-ink2)}
.two p+p{margin-top:18px}
.two strong{color:var(--pl-ink);font-weight:900;letter-spacing:-.02em}
.pt{padding:20px 0;border-top:2px solid currentColor}
.pt:first-child{border-top-width:2px}
/* 14px/900 은 WCAG 의 '큰 글자'가 아니라 기준이 4.5:1 이다. 0.5 는 3.44:1 이었다 */
.pt .m{font-size:14px;font-weight:900;letter-spacing:.1em;opacity:.66}
.pt .t{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.pt .d{font-size:16px;line-height:1.7;color:var(--pl-ink2);margin-top:4px}

/* ── 안 하는 것 ── */
.nope{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:0 52px}
@media(max-width:900px){.nope{grid-template-columns:1fr}}
.nope .n{padding:24px 0;border-top:2px solid currentColor}
.nope .n h3{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.45}
.nope .n p{font-size:16px;line-height:1.7;color:var(--pl-ink2);margin-top:6px}

/* ── 결문 ── */
.end .in{text-align:center}
.end h2{max-width:none}
.end p{font-size:18px;color:var(--pl-ink2);margin-top:14px}
.end .act{justify-content:center}
.foot .in{padding-top:22px;padding-bottom:52px;font-size:16px;font-weight:500;color:var(--pl-ink2)}
</style>
</head>

<body>

<header class="plane nav" data-tone="sand">
  <div class="in">
    <span class="brand" id="brand"></span>
    <span class="sp"></span>
    <a class="ghost" href="#" id="navcta"></a>
  </div>
</header>

<section class="plane hero" data-tone="sand"><div class="in" id="hero"></div></section>
<section class="plane"       data-tone="forest"><div class="in" id="how"></div></section>
<section class="plane"       data-tone="chalk"><div class="in" id="why"></div></section>
<section class="plane"       data-tone="coal"><div class="in" id="nope"></div></section>
<section class="plane end"   data-tone="forest"><div class="in" id="end"></div></section>
<footer class="plane foot"   data-tone="sand"><div class="in" id="foot"></div></footer>

<script src="copy.js"></script>
<script src="variants.js"></script>
<script src="assets/harness.js"></script>
<script>
var e = COPY.esc;

document.getElementById("brand").textContent = COPY.brand;
document.getElementById("navcta").textContent = COPY.navCta;
document.getElementById("foot").textContent = COPY.foot;

document.getElementById("hero").innerHTML =
  '<div class="body">' +
    "<h1>" + e(COPY.hero.line1) + "<em><b>" + e(COPY.hero.accent) + "</b>" + e(COPY.hero.line2Tail) + "</em></h1>" +
    '<p class="lede">' + e(COPY.hero.body) + "</p>" +
  "</div>" +
  '<div class="act"><a class="slab" href="#">' + e(COPY.hero.cta) + "</a>" +
  '<span class="sub">' + e(COPY.hero.sub) + "</span></div>";

document.getElementById("how").innerHTML =
  "<h2>" + e(COPY.how.h2) + "</h2>" +
  '<div class="steps">' + COPY.how.steps.map(function (s) {
    return '<div class="st"><span class="n">' + e(s.n) + "</span>" +
           "<h3>" + e(s.t) + "</h3><p>" + e(s.d) + "</p></div>";
  }).join("") + "</div>";

document.getElementById("why").innerHTML =
  "<h2>" + e(COPY.why.h2) + "</h2>" +
  '<div class="two"><div>' +
    COPY.why.lead.map(function (l) { return "<p>" + COPY.leadHtml(l, "strong") + "</p>"; }).join("") +
  "</div><div>" +
    COPY.why.pts.map(function (p) {
      return '<div class="pt"><div class="m">' + e(p.m) + '</div><div class="t">' + e(p.t) + "</div>" +
             '<div class="d">' + e(p.d) + "</div></div>";
    }).join("") +
  "</div></div>";

document.getElementById("nope").innerHTML =
  "<h2>" + e(COPY.nope.h2) + "</h2>" +
  '<div class="nope">' + COPY.nope.items.map(function (n) {
    return '<div class="n"><h3>' + e(n.t) + "</h3><p>" + e(n.d) + "</p></div>";
  }).join("") + "</div>";

document.getElementById("end").innerHTML =
  "<h2>" + e(COPY.end.h2) + "</h2><p>" + e(COPY.end.d) + "</p>" +
  '<div class="act"><a class="slab" href="#">' + e(COPY.end.cta) + "</a></div>";

Harness.mount({
  current: "d",
  variants: VARIANTS,
  persist: true,
  exportAs: { format: "css", selector: ":root" },
  controls: [
    { kind: "color", label: "상록", name: "forest", value: "#1c3b33",
      cssVar: "--forest", contrastAgainst: "--on-forest-2" },
    { kind: "color", label: "모래", name: "sand", value: "#e9e4d7",
      cssVar: "--sand", contrastAgainst: "--on-sand-2" },
    { kind: "range", label: "면 여백", name: "pad", value: 104, min: 48, max: 180, step: 4,
      cssVar: "--pad", unit: "px" },
    { kind: "segment", label: "제목 굵기", name: "hw", value: "900",
      options: [{ v: "900", label: "900" }, { v: "700", label: "700 (§4.2)" }],
      apply: function (v) { document.documentElement.style.setProperty("--h-weight", v); } },
  ],
});
</script>
</body>
</html>
