[project]
name = "finnect"
version = "0.1.0"
description = "공고 판정과 사업계획서 집필"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    # 첨부 해독(plan/07). 스파이크가 추출률 95%를 이 두 개로 쟀다.
    # 라이브러리를 바꾸면 그 숫자가 근거가 아니게 된다 — ADR-0022.
    "olefile>=0.47",
    "pdfplumber>=0.11",
    # 사용자 파일 해독(plan/12 T-0042). 첨부에는 기본으로 안 쓴다 — 그 숫자를
    # 다시 재야 해서다. USER_FILE_FORMATS 와 ATTACHMENT_FORMATS 가 따로 있는 이유.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",  # 관리 화면 폼(수집 건수 입력) 파싱
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
# OCR(ADR-0030). **기본 의존성에 안 넣는다** — onnxruntime 과 모델이 무겁고
# 배포본은 읽기 경로뿐이다(ADR-0026). `uv sync --group ocr` 로 켠다.
ocr = [
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    # 아이폰 사진 기본 포맷(T-0100). PIL 이 기본으로 못 열어서 이것이 붙어야 한다.
    "pillow-heif>=0.21",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
# 양식 채우기(ADR-0060 · plan/24). **기본 의존성에 안 넣는다** — `hwp` 가 JVM 을
# 요구하고 배포본은 읽기 경로뿐이다(ADR-0026). `uv sync --group forms` 로 켠다.
#
# **셋이 한 그룹이다.** hwpx·docx 는 순수 파이썬이라 따로 뺄 수 있지만, 나누면
# 「어느 포맷이 되는 환경인가」가 조합 넷이 되고 그것을 화면이 설명할 수 없다.
# JVM 이 없는 곳에서는 hwp 어댑터만 조용히 빠진다(ADR-0060 결정 5).
forms = [
    # hwp 쓰기가 되는 유일한 라이브러리(hwplib)의 jar 를 번들한다. **파이썬 래퍼는
    # 안 쓴다** — 1.0.0 이 hwplib 1.1.9 시절 클래스 경로를 들고 있어 죽는다.
    "hwp-hwpx-editor>=1.0",
    "jpype1>=1.5",
    "olefile>=0.47",
    "python-hwpx>=0.1",
    "python-docx>=1.1",
]
# 버리는 코드(spike/)를 다시 돌릴 때만. `uv sync --group spike`
# T-0005 배점 명시율 재검증이 measure_rate.py 의 탐지기를 그대로 쓴다.
spike = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "olefile>=0.47",
    "pdfplumber>=0.11",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finnect"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
