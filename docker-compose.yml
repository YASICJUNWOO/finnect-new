services:
  db:
    image: postgres:18-alpine
    container_name: finnect-db
    # 재부팅해도 올라온다. 없으면 정책이 `no` 라 docker 데몬만 뜨고 컨테이너는 안 뜬다.
    # `always` 가 아니라 `unless-stopped` 인 이유는, 일부러 내려 둔 것을 다시 켜지 않기 위해서다.
    restart: unless-stopped
    environment:
      POSTGRES_USER: finnect
      POSTGRES_PASSWORD: finnect
      POSTGRES_DB: finnect
    ports:
      # 호스트 5432 를 점유하지 않는다. .env 의 DATABASE_URL 과 맞춰야 한다.
      - "127.0.0.1:55433:5432"
    volumes:
      # postgres:18+ 는 /var/lib/postgresql 에 마운트한다. 하위에 data/ 를 스스로 만든다.
      # 17 이하 방식(/var/lib/postgresql/data)으로 걸면 기동 시 Exited(1) 로 죽는다.
      - finnect-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnect -d finnect"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 배포 서버의 문(ADR-0035). **API 를 직접 인터넷에 두지 않는다** — uvicorn 은
  # 127.0.0.1:8100 에만 붙어 있고 여기만 바깥을 본다.
  #
  # Docker 로 도는 이유는 이 계정이 80 번을 못 열어서다(sudo 에 비밀번호가 걸려 있다).
  # 데몬이 root 라 컨테이너 포트 공개는 된다.
  proxy:
    image: caddy:2-alpine
    container_name: finnect-proxy
    restart: unless-stopped
    # **호스트 네트워크다.** uvicorn 이 127.0.0.1:8101 에만 붙어 있어서, 다리 네트워크로는
    # 닿지 않는다 — `host.docker.internal` 은 172.17.0.1 로 풀리고 거기엔 아무도 없다.
    #
    # 대안은 uvicorn 을 0.0.0.0 에 여는 것인데, 그러면 사내망(10.3.1.231)에서 **토큰 검사
    # 앞의 API 가 그대로 보인다.** 프록시를 호스트에 붙이는 편이 노출이 작다.
    #
    # `ports:` 를 쓰지 않는다 — 호스트 네트워크에서는 무시되고, 남겨 두면 80 이 열린
    # 것처럼 보이는 거짓 기록이 된다. Caddy 가 호스트의 80·443 에 직접 붙는다.
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서와 발급 상태. **이름 있는 볼륨이어야 한다** — 컨테이너를 다시 만들 때마다
      # 새로 발급받으면 Let's Encrypt 한도에 걸린다.
      - finnect-caddy-data:/data
      - finnect-caddy-config:/config

volumes:
  finnect-pgdata:
  finnect-caddy-data:
  finnect-caddy-config:
