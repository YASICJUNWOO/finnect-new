<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E 관제 — 공고 목록·상세</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="common.css" />
    <style>
      /* E 관제 — **자유안. DESIGN.md 를 벗어난다.**
       *
       * 2026-08-21 육안 검토에서 **다크를 버리고 라이트로 돌렸다.** 좋다고 걸린 것은
       * 사이드바가 있는 껍데기였지 어두운 면이 아니었다. 다크를 빼면서 §7 「다크를
       * 기본값으로 두지 않는다」와 파랑 액센트 위반도 같이 없어졌다.
       *
       * 같은 회차에 **아이콘 레일만 있던 B 장부를 이쪽으로 합쳤다** — 레일 하나와
       * 레일+2단이 같은 결정의 정도 차이라 둘을 나란히 둘 이유가 없었다.
       *
       * 남은 위반 둘: Pretendard 아닌 서체(§3) · 13px 을 본문 옆에 둔다(§3).
       *
       * 논지: 31,327건과 3,354개 첨부를 다루는 것은 관제 화면의 규모다. 숫자를 등폭
       * 서체로 두면 마감일이 자릿수로 정렬돼 훑는 속도가 달라지고, 레일이 축을 맡으면
       * 상단이 컨텍스트만 말하면 된다. **행 높이 40px 로 첫 화면에 12행 전부가 들어간다.**
       *
       * **대가 둘.** 크롬이 세 겹이라(레일 + 1단 + 2단) §1 의 "크롬이 적은 정보 설계"와
       * 반대편에 선다. 그리고 사용자는 창업 3년 이내 사업자이지 관제 요원이 아니다(§13) —
       * 이 화면이 유능해 보이는 것과 그가 빨리 결정하는 것은 다른 일이다. */
      :root {
        --bg: #fff;
        --bg-2: #f7f8fa;
        --ink: #1f2328;
        --muted: #6b7280;
        --line: #e1e4e8;
        --action: #000;
        --urgent: #d92d20;
        --r-sm: 4px;
        --r-md: 6px;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/1.45 "IBM Plex Sans KR",
          Pretendard,
          sans-serif;
      }
      [data-numeric],
      .mono {
        font-family: "IBM Plex Mono", monospace;
        font-variant-numeric: tabular-nums;
      }
      /* 껍데기 — **좌측 레일 + 상단 2단.** 콘솔 관례를 그대로 가져왔다.
       *
       * 레일이 축을, 1단이 브랜드와 계정을, 2단이 지금 어디에 있고 데이터가 언제 것인지를 맡는다.
       * 층을 나누면 각 줄이 하는 일이 하나여서 훑을 때 눈이 헤매지 않는다.
       *
       * **대가:** 크롬이 세 겹이다(레일 + 1단 + 2단). 세로를 88px 먹고 가로를 60px 먹는데,
       * 그 자리에 들어가는 정보는 대부분 사용자가 이미 아는 것이다. §1 이 "크롬이 적은
       * 정보 설계"라고 적은 것과 정면으로 반대편에 서 있다 — 그 대비를 보려고 넣었다. */
      .app {
        display: grid;
        grid-template-columns: 60px 1fr;
        min-height: 100vh;
      }
      .rail {
        border-right: 1px solid var(--line);
        background: var(--bg-2);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 12px 0;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .rail .mark {
        display: block;
        width: 18px;
        height: 18px;
        border-radius: var(--r-md);
        background: var(--ink);
        margin-bottom: 16px;
      }
      .rail a,
      .rail span {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: var(--r-md);
        color: var(--muted);
        text-decoration: none;
        font-size: 11px;
        line-height: 1.15;
        text-align: center;
      }
      .rail .on {
        background: var(--bg-2);
        color: var(--ink);
        font-weight: 600;
      }
      .rail .soon {
        color: #c2c8d0;
      }

      .bar {
        border-bottom: 1px solid var(--line);
        background: var(--bg-2);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .tier1,
      .tier2 {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
      }
      .tier1 {
        height: 44px;
        font-weight: 600;
      }
      .tier2 {
        height: 44px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .crumb b {
        color: var(--ink);
        font-weight: 600;
      }
      .sep {
        color: #c2c8d0;
      }
      .admin {
        margin-left: auto;
        color: var(--muted);
        text-decoration: none;
        font-weight: 400;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px 24px 64px;
      }

      .band {
        display: flex;
        gap: 40px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .stat b {
        display: block;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.2;
      }
      .stat span {
        color: var(--muted);
        font-size: 13px;
      }
      .stat.u b {
        color: var(--urgent);
      }

      .sec {
        margin-top: 24px;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
      }
      .sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .hole {
        margin-top: 12px;
        color: var(--muted);
      }
      .cta {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 12px;
        padding: 0 20px;
        background: var(--action);
        color: #fff;
        border-radius: var(--r-sm);
        font-weight: 600;
        text-decoration: none;
      }
      .filters {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 8px 14px;
        color: var(--muted);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--ink);
        color: var(--ink);
      }
      .search {
        flex: 1 1 200px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 8px 14px;
        font: inherit;
        color: var(--ink);
      }
      .search::placeholder {
        color: var(--muted);
      }

      /* --- 리스트/격자 토글. **제품 UI 다. 하네스 노브가 아니다** ---
       * A 와 같은 어법이되 **E 의 칩 높이(37px)에 맞춘다** — 44px 로 두면 필터 줄에서
       * 이것만 튀어나온다. E 는 조작 요소가 전반적으로 44px 미달이고 그건 이 시안이
       * 문서 밖인 것과 같은 자리다. 켜진 쪽을 채우지 않는 것도 A 와 같다. */
      .viewToggle {
        margin-left: auto;
        display: flex;
      }
      .vt {
        width: 38px;
        min-height: 37px;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .vt:first-child {
        border-radius: var(--r-sm) 0 0 var(--r-sm);
      }
      .vt:last-child {
        border-radius: 0 var(--r-sm) var(--r-sm) 0;
        margin-left: -1px;
      }
      .vt[aria-pressed="true"] {
        border-color: var(--ink);
        color: var(--ink);
        position: relative;
        z-index: 1;
      }
      .vt svg {
        width: 17px;
        height: 17px;
      }

      /* 조밀한 행. 등폭 날짜가 왼쪽에 정렬된다 */
      .list {
        margin-top: 12px;
      }
      .item {
        display: grid;
        grid-template-columns: 128px 1fr 92px 64px;
        gap: 16px;
        align-items: baseline;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .item:first-child {
        border-top: 0;
      }
      .item:hover {
        background: var(--bg-2);
      }
      .dl {
        color: var(--muted);
        font-size: 13px;
      }
      .dl.u {
        color: var(--urgent);
      }
      .itemTitle {
        font-size: 16px;
        font-weight: 400;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .itemTitle a {
        text-decoration: none;
      }
      .org {
        color: var(--muted);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 출처는 색을 안 쓴다. 라이트로 오면서 파랑을 뺐다 — §7 이 파랑을 금지하고,
       * 남기면 액센트가 마감 하나가 아니게 된다 */
      .src {
        color: var(--muted);
        font-size: 13px;
      }
      .docs {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      /* --- 격자. **비교 축이 아니라 제품 기능이다** ---
       *
       * A 와 같은 노브인데 여기서 하는 일이 다르다. E 의 리스트는 이미 4열 그리드
       * (마감 · 제목 · 기관 · 서류)라 **격자로 가면 그 4열이 칸 안에서 세로로 쌓인다.**
       * 즉 열을 늘리는 것이 아니라 **열을 접는 것**이고, 그래서 제목이 잘리지 않는다 —
       * 리스트일 때 `text-overflow: ellipsis` 로 자르던 제목이 격자에서는 두 줄로 접힌다.
       *
       * A 와 같은 카드 형태를 쓰되 **E 의 조밀함을 지킨다** — 안여백 12px(A 는 16px),
       * 반경 4px(A 는 8px), 칸 최소폭 220px(A 는 280px). 뺀 것은 A 와 같다:
       * 카드 채움 · 그림자 · 행마다 반복되는 버튼.
       *
       * **실측(1440×1000): 4열 · 칸 높이 39→143px · 세로 1,192→1,179px.**
       * 세로가 13px 밖에 안 줄었다 — **E 에서는 격자가 거의 이득이 없다.**
       * 리스트가 이미 39px 행이라 조밀한데 카드로 만들면 칸이 3.7배가 되고,
       * 4열로 접어 번 것을 그 높이가 도로 먹는다. **조밀한 리스트일수록 격자의
       * 이득이 작다** — A(94px 행)에서 96px 줄고 E(39px 행)에서 13px 줄었다.
       *
       * 표본 12건이라 "첫 화면 행" 은 여기서 변별력이 없다 — 리스트에서도 12행이
       * 전부 들어온다. 실제 페이지 크기로는 다시 재야 한다. */
      body[data-view="grid"] .list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      body[data-view="grid"] .item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px;
        border: 1px solid var(--line);
        border-top: 1px solid var(--line);
        border-radius: var(--r-sm);
      }
      body[data-view="grid"] .item:hover {
        background: var(--bg-2);
      }
      /* 잘라 쓰던 것을 접어 쓴다 — 칸이 좁아서 자르면 제목이 남지 않는다 */
      body[data-view="grid"] .itemTitle,
      body[data-view="grid"] .org {
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
      }
      body[data-view="grid"] .docs {
        text-align: left;
        margin-top: auto;
        padding-top: 8px;
      }
      .pager {
        margin-top: 24px;
        display: flex;
        gap: 16px;
        justify-content: center;
        color: var(--muted);
      }
      .pager b {
        color: var(--ink);
      }

      .back {
        color: var(--muted);
        text-decoration: none;
      }
      .h1 {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 600;
      }
      .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .dlist {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 108px 1fr;
        gap: 6px 16px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .dlist dt {
        color: var(--muted);
        font-size: 13px;
      }
      .sec2 {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .sTitle {
        font-size: 20px;
        font-weight: 600;
      }
      .prose {
        margin-top: 12px;
        max-width: 62ch;
        color: var(--ink);
      }
      .prose p + p {
        margin-top: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 150px;
        gap: 16px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-of-type {
        border-top: 0;
      }
      .row em {
        font-style: normal;
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }
      .write {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 16px;
        padding: 0 20px;
        background: var(--action);
        color: #fff;
        border-radius: var(--r-sm);
        font-weight: 600;
        text-decoration: none;
      }
      .gap {
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .gapT {
        font-weight: 500;
      }
      .gapW {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body data-screen="list" data-view="list" data-weight="500">
    <div class="app">
      <aside class="rail">
        <a href="#" aria-label="라스트마일 홈"><i class="mark" aria-hidden="true"></i></a>
        <nav aria-label="주요 메뉴" style="display: contents">
          <a class="on" href="#" aria-current="page">지원<br />사업</a>
          <a href="#">내<br />사업</a>
          <span class="soon" aria-disabled="true">신청<br />현황<span class="srOnly"> — 아직 없어요</span></span>
        </nav>
      </aside>

      <div class="col">
        <header class="bar">
          <div class="tier1">라스트마일<a class="admin" href="#">운영 도구</a></div>
          <div class="tier2">
            <span class="crumb">지원사업 <span class="sep">›</span> <b>전체 공고</b></span>
            <span class="sep">|</span>
            <span data-numeric>기업마당 1,538 · K-Startup 29,789</span>
            <span class="admin" data-numeric>마지막 수집 2026-08-21 04:12</span>
          </div>
        </header>

        <main>
          <section class="screen s-list" id="list"></section>
          <section class="screen s-detail" id="detail"></section>
        </main>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="variants.js"></script>
    <script>
      (function () {
        var D = window.NOTICE_DATA,
          c = D.copy,
          t = D.detail;

        /* 선으로 그린 아이콘. 색은 글자 색을 따라간다 — 아이콘 자체에 색을 안 넣는다(§8) */
        var ICON = {
          list:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
            'stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
          grid:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
            'aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/>' +
            '<rect x="13" y="4" width="7" height="7" rx="1.5"/>' +
            '<rect x="4" y="13" width="7" height="7" rx="1.5"/>' +
            '<rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
        };
        var soon = D.rows.filter(function (r) {
          return D.urgent(r.d);
        }).length;

        var rows = D.rows
          .map(function (r) {
            return (
              '<li class="item"><span class="dl' +
              (D.urgent(r.d) ? " u" : "") +
              '" data-numeric>' +
              D.deadlineText(r.d) +
              '</span><span class="itemTitle"><a href="#">' +
              r.title +
              '</a></span><span class="org">' +
              r.org +
              '</span><span class="docs" data-numeric>' +
              (r.docs > 0 ? r.docs + "건" : "—") +
              "</span></li>"
            );
          })
          .join("");

        document.getElementById("list").innerHTML =
          '<h1 class="srOnly">지원사업</h1>' +
          '<div class="band"><div class="stat"><b data-numeric>' +
          D.n(c.total) +
          "</b><span>열린 공고</span></div>" +
          '<div class="stat u"><b data-numeric>' +
          soon +
          "</b><span>이번 주 마감</span></div>" +
          '<div class="stat"><b data-numeric>2,827</b><span>글자를 읽은 첨부</span></div>' +
          '<div class="stat"><b data-numeric>0</b><span>나에게 맞는 공고</span></div></div>' +
          '<section class="sec"><h2 class="title">' +
          c.recTitle +
          '</h2><p class="sub">' +
          c.recSub +
          '</p><p class="hole">' +
          c.recHole +
          '</p><a class="cta" href="#">' +
          c.upload +
          "</a></section>" +
          '<section class="sec"><h2 class="title">' +
          c.allTitle +
          '</h2><p class="sub">' +
          c.allSub +
          '</p><div class="filters"><input class="search" placeholder="공고 이름으로 찾기" />' +
          '<button class="chip" aria-pressed="true">전체</button>' +
          '<button class="chip" aria-pressed="false">기업마당</button>' +
          '<button class="chip" aria-pressed="false">K-Startup</button>' +
          '<div class="viewToggle" role="group" aria-label="목록 형태">' +
          '<button class="vt" data-v="list" aria-pressed="true" aria-label="리스트로 보기">' + ICON.list + '</button>' +
          '<button class="vt" data-v="grid" aria-pressed="false" aria-label="격자로 보기">' + ICON.grid + '</button></div></div>' +
          '<ul class="list">' +
          rows +
          '</ul><nav class="pager"><span>← 이전</span><b>1</b><span>2</span><span>3</span><span>다음 →</span></nav></section>';

        function rowsOf(arr, right) {
          return arr
            .map(function (x) {
              return '<div class="row"><span>' + x.name + "</span><em>" + right(x) + "</em></div>";
            })
            .join("");
        }

        document.getElementById("detail").innerHTML =
          '<a class="back" href="#">' +
          c.back +
          '</a><p class="dl u" data-numeric style="margin-top:16px">' +
          D.deadlineText(t.d) +
          '</p><h1 class="h1">' +
          t.title +
          '</h1><p class="meta">' +
          t.org +
          " · " +
          t.supervisor +
          " · " +
          t.cat +
          ' · <span class="src">' +
          D.SRC[t.src] +
          "</span></p>" +
          '<dl class="dlist"><dt>' +
          c.periodLabel +
          '</dt><dd data-numeric>' +
          t.period +
          "</dd><dt>" +
          c.srcLabel +
          '</dt><dd><a href="#">' +
          c.srcLink +
          "</a></dd></dl>" +
          '<section class="sec2"><h2 class="sTitle">' +
          c.summaryTitle +
          '</h2><div class="prose">' +
          t.summary
            .map(function (p) {
              return "<p>" + p + "</p>";
            })
            .join("") +
          "</div></section>" +
          '<section class="sec2"><h2 class="sTitle">' +
          c.docsTitle +
          '</h2><div style="margin-top:12px">' +
          rowsOf(t.docs, function (d) {
            return d.form ? "작성 항목 " + d.items + "개" : "그대로 첨부";
          }) +
          '</div><a class="write" href="#">' +
          c.writeCta +
          "</a></section>" +
          '<section class="sec2"><h2 class="sTitle">' +
          c.filesTitle +
          '</h2><div style="margin-top:12px">' +
          rowsOf(t.files, function (f) {
            return f.ok ? "글자를 읽었어요" : "글자가 안 나왔어요";
          }) +
          "</div></section>" +
          '<section class="sec2">' +
          t.gaps
            .map(function (g) {
              return (
                '<div class="gap"><p class="gapT">' + g.t + '</p><p class="gapW">' + g.w + "</p></div>"
              );
            })
            .join("") +
          "</section>";

        /* 토글 배선. **하네스가 아니라 화면이 하는 일이다** */
        document.querySelectorAll(".vt").forEach(function (b) {
          b.addEventListener("click", function () {
            var v = b.dataset.v;
            document.body.dataset.view = v;
            document.querySelectorAll(".vt").forEach(function (x) {
              x.setAttribute("aria-pressed", String(x.dataset.v === v));
            });
          });
        });
      })();
    </script>

    <script src="assets/harness.js"></script>
    <script>
      Harness.mount({
        current: "e",
        variants: window.VARIANTS,
        controls: [window.SCREEN_CONTROL, window.WEIGHT_CONTROL],
        exportAs: { format: "css", selector: ":root" },
        persist: true,
      });
    </script>
  </body>
</html>
