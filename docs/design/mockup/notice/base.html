<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>현행 — 공고 목록·상세</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      /* 현행 재현. **대조군이다** — 여기서 값을 뽑아 쓰지 않는다.
       *
       * web/app/(product)/ 의 지금 화면을 그대로 옮긴 것이고, 토큰 실값은
       * web/app/tokens.css 에서 왔다. 회색 캔버스 위에 흰 카드를 얹는 구성이다. */
      :root {
        --canvas: #f7f7f8;
        --surface: #fff;
        --ink: #222;
        --ink-2: #5f656d;
        --ink-3: #6b7280;
        --line: #d4d4d4;
        --line-2: #dfe2e6;
        --action: #000;
        --urgent: #d92d20;
        --urgent-bg: #fff5f4;
        --urgent-line: #f7d4d0;
        --r-sm: 4px;
        --r-md: 6px;
        --r: 8px;
      }

      body {
        background: var(--canvas);
        color: var(--ink);
        font:
          400 16px/1.45 Pretendard,
          sans-serif;
      }

      /* --- 껍데기 --- */
      .bar {
        background: var(--surface);
        border-bottom: 1px solid var(--line-2);
      }
      .barIn {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 24px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        text-decoration: none;
      }
      .mark {
        width: 18px;
        height: 18px;
        border-radius: var(--r-md);
        background: var(--ink);
      }
      .menu {
        display: flex;
        gap: 16px;
        margin-left: 8px;
      }
      .menu a,
      .menu span {
        text-decoration: none;
        color: var(--ink-3);
        padding: 4px 0;
      }
      .menu .on {
        color: var(--ink);
        font-weight: 600;
        box-shadow: inset 0 -2px 0 var(--ink);
      }
      .menu span {
        color: var(--ink-4, #cbd0d6);
        cursor: not-allowed;
      }
      .admin {
        margin-left: auto;
        font-size: 13px;
        color: var(--ink-3);
        text-decoration: none;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      /* --- 섹션 --- */
      .sec + .sec {
        margin-top: 48px;
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .n {
        font-size: 16px;
        font-weight: 400;
        color: var(--ink-3);
      }
      .sub {
        margin-top: 4px;
        font-size: 13px;
        color: var(--ink-3);
      }
      .hole {
        margin-top: 16px;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        color: var(--ink-3);
      }

      .filters {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 10px 16px;
        color: var(--ink);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--ink);
        font-weight: 600;
      }
      .search {
        flex: 1 1 220px;
        min-width: 180px;
        background: #f2f2f2;
        border: 0;
        border-radius: var(--r-sm);
        padding: 10px 16px;
        font: inherit;
        color: var(--ink);
      }
      .search::placeholder {
        color: var(--ink-3);
      }

      /* --- 목록. 카드 하나 안에 줄을 나눈다 --- */
      .list {
        margin-top: 16px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        overflow: hidden;
      }
      .item {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 16px 24px;
      }
      .item + .item {
        border-top: 1px solid var(--line-2);
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .dl {
        font-size: 13px;
        color: var(--ink-3);
      }
      .dl.u {
        color: var(--urgent);
        font-weight: 600;
      }
      .itemTitle {
        margin-top: 4px;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.45;
      }
      .itemTitle a {
        text-decoration: none;
      }
      .itemTitle a:hover {
        text-decoration: underline;
      }
      .facts {
        margin-top: 4px;
        font-size: 13px;
        color: var(--ink-3);
      }
      .dot {
        margin: 0 6px;
        color: var(--line);
      }
      .docs {
        flex: none;
        width: 76px;
        text-align: right;
        font-size: 13px;
        color: var(--ink-3);
        padding-top: 20px;
      }
      .docs b {
        font-size: 16px;
        color: var(--ink);
      }

      .pager {
        margin-top: 24px;
        display: flex;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        color: var(--ink-3);
      }
      .pager b {
        color: var(--ink);
      }

      /* --- 상세 --- */
      .back {
        display: inline-block;
        font-size: 13px;
        color: var(--ink-3);
        text-decoration: none;
      }
      .head {
        margin-top: 16px;
      }
      .h1 {
        margin-top: 4px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }
      .meta {
        margin-top: 8px;
        font-size: 13px;
        color: var(--ink-3);
      }
      .dlist {
        margin-top: 24px;
        padding: 16px 24px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 8px 16px;
        font-size: 16px;
      }
      .dlist dt {
        color: var(--ink-3);
        font-size: 13px;
        align-self: center;
      }
      .sec2 {
        margin-top: 32px;
      }
      .sTitle {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }
      .prose {
        margin-top: 12px;
      }
      .prose p + p {
        margin-top: 12px;
      }
      .docList {
        margin-top: 12px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        overflow: hidden;
      }
      .docRow {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 24px;
        font-size: 16px;
      }
      .docRow + .docRow {
        border-top: 1px solid var(--line-2);
      }
      .docRow em {
        font-style: normal;
        font-size: 13px;
        color: var(--ink-3);
      }
      .write {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 16px;
        padding: 0 20px;
        background: var(--action);
        color: #fff;
        border-radius: var(--r-sm);
        font-weight: 600;
        text-decoration: none;
      }
      .gaps {
        margin-top: 32px;
        display: grid;
        gap: 12px;
      }
      .gap {
        padding: 16px 24px;
        background: var(--surface);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
      }
      .gapT {
        font-size: 16px;
        font-weight: 600;
      }
      .gapW {
        margin-top: 4px;
        font-size: 13px;
        color: var(--ink-3);
      }
    </style>
  </head>
  <body data-screen="list">
    <header class="bar">
      <div class="barIn">
        <a class="brand" href="#"><i class="mark" aria-hidden="true"></i>라스트마일</a>
        <nav class="menu" aria-label="주요 메뉴">
          <a class="on" href="#" aria-current="page">지원사업</a>
          <a href="#">내 사업</a>
          <span aria-disabled="true">신청 현황</span>
        </nav>
        <a class="admin" href="#">운영 도구</a>
      </div>
    </header>

    <main>
      <section class="screen s-list" id="list"></section>
      <section class="screen s-detail" id="detail"></section>
    </main>

    <script src="data.js"></script>
    <script src="variants.js"></script>
    <script>
      (function () {
        var D = window.NOTICE_DATA;
        var c = D.copy;

        function rows() {
          return D.rows
            .map(function (r) {
              var u = D.urgent(r.d);
              return (
                '<li class="item"><div class="body">' +
                '<p class="dl' +
                (u ? " u" : "") +
                '" data-numeric>' +
                D.deadlineText(r.d) +
                "</p>" +
                '<h3 class="itemTitle"><a href="#">' +
                r.title +
                "</a></h3>" +
                '<p class="facts">' +
                r.org +
                " · " +
                r.cat +
                '<span class="dot" aria-hidden="true">·</span>' +
                D.SRC[r.src] +
                "</p></div>" +
                '<div class="docs" data-numeric>' +
                (r.docs > 0 ? "낼 서류 <b>" + r.docs + "</b>" : "서류 없음") +
                "</div></li>"
              );
            })
            .join("");
        }

        document.getElementById("list").innerHTML =
          '<h1 class="srOnly">지원사업</h1>' +
          '<section class="sec"><h2 class="title">' +
          c.recTitle +
          '</h2><p class="sub">' +
          c.recSub +
          '</p><p class="hole">' +
          c.recHole +
          "</p></section>" +
          '<section class="sec"><h2 class="title">' +
          c.allTitle +
          '<span class="n" data-numeric>' +
          D.n(c.total) +
          '건</span></h2><p class="sub">' +
          c.allSub +
          "</p>" +
          '<div class="filters"><input class="search" placeholder="공고 이름으로 찾기" />' +
          '<button class="chip" aria-pressed="true">전체</button>' +
          '<button class="chip" aria-pressed="false">기업마당</button>' +
          '<button class="chip" aria-pressed="false">K-Startup</button></div>' +
          '<ul class="list">' +
          rows() +
          "</ul>" +
          '<nav class="pager"><span>← 이전</span><b>1</b><span>2</span><span>3</span><span>다음 →</span></nav>' +
          "</section>";

        var t = D.detail;
        document.getElementById("detail").innerHTML =
          '<a class="back" href="#">' +
          c.back +
          "</a>" +
          '<header class="head"><p class="dl u" data-numeric>' +
          D.deadlineText(t.d) +
          '</p><h1 class="h1">' +
          t.title +
          '</h1><p class="meta">' +
          t.org +
          " · " +
          t.supervisor +
          " · " +
          t.cat +
          '<span class="dot" aria-hidden="true">·</span>' +
          D.SRC[t.src] +
          "</p></header>" +
          '<dl class="dlist"><dt>' +
          c.periodLabel +
          '</dt><dd data-numeric>' +
          t.period +
          "</dd><dt>" +
          c.srcLabel +
          '</dt><dd><a href="#">' +
          c.srcLink +
          "</a></dd></dl>" +
          '<section class="sec2"><h2 class="sTitle">' +
          c.summaryTitle +
          '</h2><div class="prose">' +
          t.summary
            .map(function (p) {
              return "<p>" + p + "</p>";
            })
            .join("") +
          "</div></section>" +
          '<section class="sec2"><h2 class="sTitle">' +
          c.docsTitle +
          '</h2><div class="docList">' +
          t.docs
            .map(function (d) {
              return (
                '<div class="docRow"><span>' +
                d.name +
                "</span><em>" +
                (d.form ? "작성 항목 " + d.items + "개" : "그대로 첨부") +
                "</em></div>"
              );
            })
            .join("") +
          '</div><a class="write" href="#">' +
          c.writeCta +
          "</a></section>" +
          '<section class="sec2"><h2 class="sTitle">' +
          c.filesTitle +
          '</h2><div class="docList">' +
          t.files
            .map(function (f) {
              return (
                '<div class="docRow"><span>' +
                f.name +
                "</span><em>" +
                (f.ok ? "글자를 읽었어요" : "글자가 안 나왔어요") +
                "</em></div>"
              );
            })
            .join("") +
          "</div></section>" +
          '<div class="gaps">' +
          t.gaps
            .map(function (g) {
              return (
                '<div class="gap"><p class="gapT">' +
                g.t +
                '</p><p class="gapW">' +
                g.w +
                "</p></div>"
              );
            })
            .join("") +
          "</div>";
      })();
    </script>

    <script src="assets/harness.js"></script>
    <script>
      /* 하단 바는 **목업 전용이다.** 코드로 옮길 때는 바를 빼고 값만 전사한다. */
      Harness.mount({
        current: "base",
        variants: window.VARIANTS,
        controls: [window.SCREEN_CONTROL],
        exportAs: { format: "css", selector: ":root" },
        persist: true,
      });
    </script>
  </body>
</html>
